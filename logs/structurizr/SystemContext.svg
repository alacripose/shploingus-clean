    <text x="250" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">The player</text>
    <text x="250" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#ffffff">[Person]</text>
    <text x="250" y="258" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ffffff">files plain prose tickets at the console</text>
  </g>
  <g class="draggable-element" data-element-id="569ba49e-7827-429a-b59e-89724e8ee7c5" transform="translate(0, 0)">
    <circle cx="1350" cy="120" r="60" fill="#08427b" stroke="#000000" stroke-width="2"/><rect x="1210" y="190" width="280" height="90" rx="10" fill="#08427b" stroke="#000000" stroke-width="2"/>
    <text x="1350" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">The agent</text>
    <text x="1350" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#ffffff">[Person]</text>
    <text x="1350" y="258" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ffffff">runs the console&apos;s verbs through the</text>
    <text x="1350" y="274" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ffffff">api, player-equivalent</text>
  </g>
  <g class="draggable-element" data-element-id="ce1a9a63-a573-4cfd-b63a-550f23ea5fd3" transform="translate(0, 0)">
    <rect x="600" y="50" width="400" height="250" rx="5" fill="#1168bd" stroke="#000000" stroke-width="2"/>
    <text x="800" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Shploingus</text>
    <text x="800" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#ffffff">[Software System]</text>
    <text x="800" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ffffff">the voxel world, its governance stack,</text>
    <text x="800" y="144" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ffffff">and the window a person sees it through</text>
