    <text x="250" y="1342" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ffffff">laya — typed questions (Choice / Score</text>
    <text x="250" y="1358" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ffffff">/ Noul) and calibrated answers; no test</text>
