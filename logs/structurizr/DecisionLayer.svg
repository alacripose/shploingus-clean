    <text x="250" y="142" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ffffff">oracle::Oracle — one implementation of</text>
    <text x="250" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ffffff">the seam, with oracle::UnreachableOracle</text>
    <text x="250" y="174" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ffffff">for the skipped case; model-oracle</text>
