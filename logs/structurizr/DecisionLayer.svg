    <text x="250" y="558" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ffffff">delegating to the readers, never by</text>
    <text x="250" y="574" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ffffff">re-deciding</text>
