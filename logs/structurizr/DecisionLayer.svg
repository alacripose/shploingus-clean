    <text x="800" y="199" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#ffffff">[Rust]</text>
    <text x="800" y="217" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ffffff">decision::Decider — Subject -&gt;</text>
    <text x="800" y="233" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ffffff">Assessment, one vocabulary for every</text>
    <text x="800" y="249" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ffffff">decision; a missing instrument is a</text>
