    <text x="250" y="924" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#ffffff">[Rust]</text>
    <text x="250" y="942" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ffffff">policy::decide — one matrix, one</text>
    <text x="250" y="958" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ffffff">decision function, one audit sink; deny</text>
    <text x="250" y="974" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ffffff">by default</text>
  </g>
