[package]
name = "voxel-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The workspace rule is that every GPU dependency names its reason, because an
# extra dependency is a replay-affecting input (see the root `Cargo.toml`).
#
#   wgpu     — the only way this repository has to turn a `Mesh` into pixels.
#              The offline registry cache already holds `wgpu 30.0.1` and its
#              whole closure, so this is buildable with `--offline`.
#   pollster — `wgpu 30` made adapter enumeration async. This is a headless
#              renderer with no async runtime and no wish for one, so it needs
#              exactly one function: "block until this future finishes". That is
#              what `pollster` is, in about 40 lines, and writing it here would
#              be a hand-rolled executor to avoid naming one.
#
#   glyphon  — the text half of the HUD. `voxel-ui` decides *what* is said and
#              where; something still has to turn a string into glyphs, shape
#              them and pack them into an atlas, and that is a font-shaping
#              engine, not a rendering detail. `glyphon 0.12.0` and its whole
#              closure (`cosmic-text`, `swash`, `etagere`, `fontdb`) are in the
#              offline registry cache. It is declared **here** rather than in
#              the bin so the HUD can be drawn into an offscreen target and
#              measured in a test — a HUD that only exists inside an event loop
#              is a HUD nobody can check.
#
#   voxel-package — the shell's windows are **data the shell mounts** (UI-SPEC
#              §1, H-9.7), and the declaration is a `recipe/3` package. The
#              mount parses exactly the frame the build gate compiles, so the
#              client cannot hold a second opinion about what a window is — and
#              an unknown `theme-role` or an older header is refused by the
#              same code that refused it at build time. The crate has no
#              external dependencies of its own.
#
# There is deliberately nothing else. `bytemuck` is NOT used: vertex data is
# assembled as `f32` and passed as a byte slice, which `wgpu` accepts, so the
# crate does not grow a derive-macro dependency to save four `to_le_bytes`
# calls. And there is no windowing dependency here at all — that is the
# `shploingus` bin's job, so this crate stays renderable **offscreen**, which
# is what lets a frame be verified without a display.
# The examples render a frame and **write it where a person can look at it**, which
# is the one thing a `Frame` in memory cannot do. `png 0.18` is in the offline
# registry cache, and it is a **dev**-dependency: no shipped path writes a file, and
# the encoder is named rather than hand-rolled because a hand-rolled PNG is a
# compression format nobody asked this repository to maintain.
[dev-dependencies]
png = "0.18"

[dependencies]
voxel-model = { path = "../voxel-model" }
voxel-package = { path = "../voxel-package" }
#   voxel-axis-matrix — the API window's per-segment rows: the star a predicate lit, the
#                   tier the cell's own requirements hold, and the unchecked cells with
#                   their reasons. The pane renders the matrix's own `value()` rather than
#                   formatting the star and the tier a second time, which is how a window
#                   and a report come to disagree about the same cell.
voxel-axis-matrix = { path = "../axis/matrix" }
#   voxel-axis-verify — **the cells.** The API window's matrix is measured, not assembled by this
#                   crate: `verify(tree, ticket)` reads the census and its pins, the conformance
#                   files, the workspace's witnesses and the ladders, and answers with one cell per
#                   segment or the decline that names the source that could not witness it. A client
#                   that built its own readings would be the second verifier, and the first time the
#                   two disagreed the window would show a table the gate never measured.
voxel-axis-verify = { path = "../axis/verify" }
#   voxel-axis-artifact — **the package.** The verifier measures the cells; this crate turns them
#                   into the format `PATCH-042` states: one statement per line, each cited at its
#                   witness and laddered with the cell's own reading, a pin over the bytes, and the
#                   files a reproduction re-reads. The shell produces it and prints it, so a package
#                   that cannot be signed is refused on the console rather than assumed away.
voxel-axis-artifact = { path = "../axis/artifact" }
#   voxel-axis-security — **the key the pin is checked against.** The package's pin gate asks a
#                   `Verifier`; this is the backend: a key held outside the checkout (a key inside it
#                   is in every clone), the signature over the package's bytes, and the refusals that
#                   name a missing key, a foreign key and a signature over other bytes.
voxel-axis-security = { path = "../axis/security" }
#   voxel-axis-mcp — **the authority an agent speaks through.** Not a second server: it takes the
#                   cells and the package this mount already produced, hands out the recipe for a
#                   named ticket, and decides an apply only under a ticket-scoped grant signed by the
#                   security layer. The console prints a grant issued and a grant refused, because a
#                   refusal nobody sees is a refusal the player assumes did not happen.
voxel-axis-mcp = { path = "../axis/mcp" }
voxel-noise = { path = "../voxel-noise" }
voxel-shapers = { path = "../voxel-shapers" }
voxel-mesh = { path = "../voxel-mesh" }
voxel-stream = { path = "../voxel-stream" }
voxel-appearance = { path = "../voxel-appearance" }
#   voxel-light �� the solar disc's own dilution, so the cuboid sun is the same sun
#                   the band table radiates from rather than a second stated number.
voxel-light = { path = "../voxel-light" }
voxel-work = { path = "../voxel-work" }
voxel-ui = { path = "../voxel-ui" }
wgpu = "30"
pollster = "0.3"
glyphon = "0.12"
