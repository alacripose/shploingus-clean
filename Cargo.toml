[workspace]
resolver = "2"
members = [
    "crates/voxel-model",
    "crates/axis/ladder",
    "crates/axis/coverage",
    "crates/axis/unit",
    "crates/axis/claim",
    "crates/axis/view",
    "crates/axis/civilians",
    "crates/axis/being",
    "crates/axis/matrix",
    "crates/axis/verify",
    "crates/axis/artifact",
    "crates/axis/security",
    "crates/axis/mcp",
    "crates/axis/balance",
    "crates/voxel-noise",
    "crates/voxel-mesh",
    "crates/voxel-shapers",
    "crates/voxel-stream",
    "crates/voxel-instrument",
    "crates/voxel-appearance",
    "crates/voxel-light",
    "crates/voxel-work",
    "crates/voxel-audio",
    "crates/voxel-client",
    "crates/shploingus",
    "crates/voxel-ui",
    "crates/voxel-package",
    "crates/voxel-mcp",
    "crates/voxel-von",
]

# shploingus-clean — a fresh implementation of the Shploingus voxel world.
#
# This workspace is NOT a copy of any other tree. It consumes the *package API*
# (the ledger/signature/conformance core) as a crate boundary, and everything a
# player can see was written here. Reference projects named in
# references.md are architectural sources: their *ideas* are implemented from
# first principles and their papers, never their files.
#
# Dependency discipline (inherited from the project this serves):
#   1. does it do something we need?      (answered beside the line)
#   2. is it actually USED?               (a resolve is not a use)
#
# The headless crates below depend on nothing but `sha2`. The GPU crates are
# declared with the client and each names its reason.

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "Apache-2.0"

[workspace.dependencies]
# Content identity. The world is content-addressed: two runs of the same
# generator over the same seed must produce the same digests, and this is the
# one hash function the project accepts for that.
sha2 = "0.10"

# **The OS entropy source, and the only reason a headless crate names a second dependency.** A signing
# key drawn from a hash of the clock or the process id is a key an attacker can enumerate; the
# platform's own random device is the one source this tree does not reimplement. Used by
# `voxel-axis-security` alone, when it creates a key that does not exist yet.
getrandom = "0.2"

# The wire format an MCP client speaks. Named once here and used by `voxel-mcp`
# alone: the gate's other crates still carry no external dependency, which is the
# property the package API boundary exists to keep.
serde_json = "1"

# **The classifier.** `jigor` is the library the sibling tree measured: `VonBackend` answers our
# own question shapes (`choice` / `noul` / `score`) about a state, on CPU, from a cached ONNX
# export. `default-features = false` drops the `cuda` default, because this is the CPU path
# upstream measured (`F:/planet-models` holds `models--Zatsepin--von-onnx-fp16`).
#
# It is named here and used by `voxel-von` alone: the gate crates still carry no external
# dependency, and a judgment that needs a model is a crate you have to ask for.
jigor = { version = "0.1.10", default-features = false }

# `esaxx-rs` ships /MT objects that cannot link with jigor's prebuilt ONNX Runtime (/MD).
# `vendor/esaxx-rs` is upstream 0.1.10 with that single line changed — the same fix, and the
# same reason, as the sibling tree's root manifest.
[patch.crates-io]
esaxx-rs = { path = "vendor/esaxx-rs" }

[profile.dev]
opt-level = 1

# A world generator is arithmetic-heavy enough that a debug build is unusable
# for play. Dependencies are optimised always; first-party code is optimised
# enough to play while staying debuggable.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
