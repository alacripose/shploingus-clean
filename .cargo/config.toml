# **The build tree is on `F:`**, at `F:/shploingus-target`, declared by `[build]` below.
#
# That is the third move and it was asked for rather than argued: on 2026-10-23 the build was
# moved off `C:` and the `C:` tree was deleted, so a build here does not leave a second copy on
# the system volume. `C:` held 22 GB free that day and `F:` 18 GB, both short of what a
# twenty-gigabyte tree plus its link step wants, so the tree is kept in one place and cleared
# there (`cargo space`, then `cargo clean`) rather than growing on both.
#
# What this costs is measured and stays written down: `F:` is the machine's only mechanical disk
# and kache's store is on `C:`, so a cache hit is restored by **copy** across volumes instead of
# as a hardlink. The build is therefore slower here than the prose below can make it sound, and
# the prose is kept because it is the measurement, not the wish. What it is *not* is a reason to
# grow a second tree on `C:`, which is what the paragraph below used to conclude.
#
# The older history, kept for its numbers:
#
# That is a reversal, and the measurements are why. The tree used to be at `F:/shploingus-target`
# and then briefly at `C:/shploingus-target`, moved out of the repository for reasons that were
# about *space*: `C:` was once down to about 300 MB free of 465 GB, and the tree was guessed at
# "1-2 GB". Measured 2026-10-08 it is **20.36 GB in 37,653 files**, with the kache store at
# 11.72 GB. `C:` has room for it now, so the space argument is gone.
#
# What is left is speed, and it points at the same place the repository already sits on:
#
# * `C:` is disk 0, a `WDC WDS500G2B0A` **SSD**.
# * `F:` is disk 2, an `ST9250315AS` **HDD** — the machine's only mechanical disk. A cargo
#   build is tens of thousands of small random file operations, creating, renaming and
#   re-reading `.o`, `.rmeta`, `.rlib`, `.d` and `.pdb` files, which is the one workload where
#   a 5400 rpm drive is one to two orders of magnitude behind an SSD on IOPS.
# * `D:` and `H:` are also SSDs but had 4.9 GB and 1.2 GB free the same day.
#
# The source lives on `C:`, and `target/` is on `C:` with it — one volume, the fast one, no
# override to remember. `target/` is the first line of `.gitignore`, so a build in the
# repository leaves `git status` clean.
#
# The kache store moved with it (`~/.config/kache/config.toml`, now `C:/kache`), and that is
# not tidiness: kache restores a cache hit as a **hardlink** when the store and the target
# directory are on the same volume, and as a **copy** when they are not. Same volume means a
# cache hit costs zero extra bytes and no copy at all.
#
# Not done here, and named: `C:` is NTFS rather than a ReFS **Dev Drive**, so the store gets no
# block cloning — kache reports the missing copy-on-write itself — and Defender scans the
# volume normally. A Dev Drive exempts its own volume from real-time scanning, which is the
# other half of what makes a build directory fast on Windows. That is a volume-level change,
# not a config one, and it was not made.
#
# **Correction, 2026-10-10.** The paragraph above says a cache hit on the same volume "costs zero
# extra bytes and no copy at all", and kache's own advice line says otherwise: on this volume it
# reports *"cache hits are restored by COPY — the cache and build tree do not share storage
# blocks, roughly doubling disk for cached content"*, and names `[cache] windows_hardlink = true`
# as the switch that would dedup them. That switch is **not** set, on purpose: kache warns it is
# only safe *"if your build never deletes or rewrites an object output"*, and `voxel_package::space`
# is a guard that deletes object outputs by design. So the store costs its own bytes, the tree
# costs its own, and the size guard is what keeps the second one from filling the volume.

# **Decision, 2026-10-21: the build tree stays on `C:`, and the kache store pays for it.**
#
# The question was whether to put this repository's `target/` back on `F:`. It is answered no,
# for the reasons above and one more that is measured rather than argued:
#
# * `C:` is the SSD and `F:` is the machine's only mechanical disk (the paragraph above, kept
#   for that measurement).
# * kache restores a hit as a hardlink only when the store and the target are on one volume. A
#   target on `F:` with the store on `C:` copies every restored artifact onto the HDD, which is
#   the slowest possible arrangement of the two files that dominate a build.
#
# **What actually filled `C:` was not this tree.** Measured on 2026-10-21, at 1.8 GB free of
# 465 GB: `<repo>/target` was **4.8 GB**, and the kache store at `C:/kache` was **21 GB** — more
# than four times the tree it caches. On this NTFS volume the store is a *copy* of that tree and
# not a set of block references to it (the `[cache] windows_hardlink` note above is why), so the
# store is the first thing to go when the volume runs short. Removing `C:/kache` returned `C:` to
# **23 GB free**; the target tree was kept, so the next build is still incremental.
#
# The standing rule, then, in the order it is applied:
#
# 1. **Twelve GiB free before a build.** Below that, do not start one here: a link step needs
#    transient space, and a build that runs out mid-write leaves truncated `.rmeta` files that
#    cargo then reports as "invalid metadata", which costs more time than the space was worth.
# 2. **Clear the cache store first** (`C:/kache`). It is a cache: a miss costs a rebuild of that
#    object, never a byte of source, and it rebuilds itself on the next build without being asked.
# 3. **Then the tree** (`cargo clean`), which is the expensive one and is only for a volume that
#    is short even with no store on it.
#
# `cargo space --floor 12GiB` below is the same number, asked of the gate rather than of a person.
#
# **The rule above still applies, to this volume.** `F:` carries the tree and the link step's
# transient writes, so the floor is asked of it before a build rather than of `C:`.
[build]
# One tree, on `F:`. Absolute, because a relative path would be resolved against whatever
# directory cargo happens to be invoked from.
target-dir = "F:/shploingus-target"

[alias]
# The build-tree size guard, asked on its own: the same pass the gate runs, on the crate whose
# dependencies are headless — which is what makes it usable when the GPU stack cannot build
# because the volume is full. `cargo space --floor 12GiB` restates the headroom it holds.
# The corpus survey, asked on its own: what the other trees across these drives hold, measured
# before a byte of them is imported. Deliberately outside the gate — `F:` answered one naive walk
# in 400 seconds, and the gate runs on every build. `cargo ingest --max-files 500` bounds it.
space = "run -p voxel-package --example space-guard --"
ingest = "run -p voxel-package --example ingest --"
